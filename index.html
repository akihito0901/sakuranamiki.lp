    <!-- ヒーロー動画のA/Bテスト -->
    <script>
        /*
         * URLの ?v= でヒーローを出し分ける。
         *   ?v=a … 共感訴求（「また同じかも…」）
         *   ?v=b … 権威訴求（Google口コミ★5.0）
         * 広告のリンク先URLごとにパターンを固定する方式なので、
         * ランダム割り当てはしない（同じ人には常に同じものが出る）。
         * 指定なし（オーガニック流入・直打ち・広告以外）は a を表示。
         */
        (function () {
            var q = (new URLSearchParams(location.search).get('v') || '').toLowerCase();
            var variant = (q === 'b') ? 'b' : 'a';
            var hero = (variant === 'b')
                ? './images/hero-ab-b-authority.webp'
                : './images/hero-ab-a-empathy.webp';

            window.AB_VARIANT = variant;
            document.documentElement.setAttribute('data-variant', variant);

            // ヒーローは画面最上部＝表示速度に直結するので、選ばれた方だけ先読みする。
            // このLPはReactが組み立てる方式で初回描画が遅いため、先読みの効果が大きい。
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = hero;
            document.head.appendChild(link);

            // 「どちらを見たか」を計測側へ送る
            window.addEventListener('load', function () {
                if (window.fbq) window.fbq('trackCustom', 'LPView', { variant: variant });
                if (window.clarity) window.clarity('set', 'ab_variant', variant);
            });

            /*
             * ▼ 計測の考え方
             *
             * Lead        … 予約に向かう行動。LINE追加タップ と 電話タップ の2つ。
             *               Metaの最適化対象はこれ。「予約したい人」を探させる。
             * FindLocation… 場所の確認（Googleマップタップ）。
             *               計測はするが Lead には入れない。理由は下記。
             *
             * マップタップをLeadに含めない理由：
             *   マップは「どこにあるか見ただけ」の人も大量に押す。これをLeadに混ぜると、
             *   (1) 件数が水増しされてCPAが実態より良く見える
             *   (2) さらに悪いことに、Metaが「マップを押しやすい人」を探しに行き、
             *       予約する気のない層に配信が寄っていく
             *   計測しておけばリターゲティング用オーディエンスには使えるので、
             *   別イベントとして残すのが正解。
             */
            function fire(event, kind) {
                if (window.fbq) window.fbq('track', event, { content_name: kind + '_' + variant });
                if (window.clarity) window.clarity('set', 'cta_tapped', kind);
            }

            // LINE追加タップ（従来から Lead として計測しているもの）
            window.trackLead = function () { fire('Lead', 'line'); };
            // 電話タップ（これまで未計測。予約意図はLINEより強い）
            window.trackTel = function () { fire('Lead', 'tel'); };
            // Googleマップタップ（最適化には使わない）
            window.trackMap = function () { fire('FindLocation', 'map'); };
        })();
    </script>
    <!-- End A/B -->

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const useFadeUp = () => {
            const ref = useRef(null);
            useEffect(() => {
                const obs = new IntersectionObserver(
                    ([e]) => { if (e.isIntersecting) e.target.classList.add('visible'); },
                    { threshold: 0.1 }
                );
                if (ref.current) obs.observe(ref.current);
                return () => obs.disconnect();
            }, []);
            return ref;
        };

        /* ─── LINE CTA ─── */

            const ref = useRef(null);
            const [fired, setFired] = useState(false);

            useEffect(() => {
                const obs = new IntersectionObserver(
                    ([e]) => { if (e.isIntersecting && !fired) { setFired(true); obs.disconnect(); } },
                    { threshold: 0.6 }
                );
                if (ref.current) obs.observe(ref.current);
                return () => obs.disconnect();
            }, [fired]);

            return (
                <div ref={ref} className={`w-full ${flush ? '' : 'px-4'} ${fired ? 'cta-line-animated' : ''} ${className}`}>
                    <a href="https://lin.ee/uqCRkRL" onClick={() => window.trackLead()}

                        <div className="relative rounded-2xl overflow-hidden shadow-2xl border-[3px] border-white/50">
                            <img src="./images/popup-quiz.png" alt="コリが戻る理由は？" className="w-full h-auto block" />
                            
                            {/* CTA Button overlay */}
                            <div className="absolute bottom-[4%] left-0 w-full px-8 flex justify-center">
                                <button 
                                    onClick={onClose}
                                    className="w-full max-w-[280px] bg-gradient-to-br from-[#ea580c] to-[#c2410c] text-white font-bold text-[17px] py-3.5 rounded-full shadow-lg active:scale-[0.96] transition-all flex items-center justify-center gap-2 group animate-btn-pulse"
                                >
                                    <span>続きをチェック！</span>
                                    <i className="fas fa-chevron-down text-sm group-hover:translate-y-1 transition-transform"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ─── App ─── */
        const App = () => {
            const [showPopup, setShowPopup] = useState(false);
            
            useEffect(() => { 
                window.scrollTo(0, 0); 
                if (showPopup) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
            }, [showPopup]);

            return (
                <div className="w-full max-w-md mx-auto shadow-xl bg-white min-h-screen relative my-0 md:my-8">
                    {showPopup && <CampaignPopup onClose={() => setShowPopup(false)} />}
                    <StickyHeader />
                    <Headline />
                    <HeroFollowup />
                    <HeroBookingCTA />
                    <EmpathySection />
                    <ProblemSection />
                    <CauseSection />
                    <SolutionSection />
                    <ClinicDifferenceSection />
                    <BenefitSection />
                    <ReviewsSection />
                    <ComparisonSection />
                    <FeatureSection />
                    <QASection />
                    <FinalCTA />
                    <Footer />
                    <StickyCTA />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        requestAnimationFrame(() => { window.scrollTo(0, 0); });
    </script>
</body>

</html>
