    <!-- ヒーロー動画のA/Bテスト -->
    <script>
        /*
         * URLの ?v= でヒーローを出し分ける。
         *   ?v=a … 共感訴求（「また同じかも…」）
         *   ?v=b … 権威訴求（Google口コミ★5.0）
         * 広告のリンク先URLごとにパターンを固定する方式なので、
         * ランダム割り当てはしない（同じ人には常に同じものが出る）。
         * 指定なし（オーガニック流入・直打ち・広告以外）は a を表示。
         */
        (function () {
            var q = (new URLSearchParams(location.search).get('v') || '').toLowerCase();
            var variant;
            if (q === 'a' || q === 'b') {
                // URLで指定があればそれに従う（表示確認・共有用）
                variant = q;
            } else {
                // 指定なし＝広告からの通常の流入。半分ずつ振り分ける。
                // 一度決めた結果は保存し、同じ人には常に同じものを見せる
                // （再訪で別パターンが出ると計測が壊れるため）
                try { variant = localStorage.getItem('ab_hero'); } catch (e) { variant = null; }
                if (variant !== 'a' && variant !== 'b') {
                    variant = Math.random() < 0.5 ? 'a' : 'b';
                    try { localStorage.setItem('ab_hero', variant); } catch (e) {}
                }
            }
            var hero = (variant === 'b')
                ? './images/hero-ab-b-authority.webp'
                : './images/hero-ab-a-empathy.webp';

            window.AB_VARIANT = variant;
            document.documentElement.setAttribute('data-variant', variant);

            // ヒーローは画面最上部＝表示速度に直結するので、選ばれた方だけ先読みする。
            // このLPはReactが組み立てる方式で初回描画が遅いため、先読みの効果が大きい。
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = hero;
            document.head.appendChild(link);

            // 「どちらを見たか」を計測側へ送る
            window.addEventListener('load', function () {
                if (window.fbq) window.fbq('trackCustom', 'LPView', { variant: variant });
                if (window.clarity) window.clarity('set', 'ab_variant', variant);
            });

            /*
             * ▼ 計測の考え方
             *
             * Lead        … 予約に向かう行動。LINE追加タップ と 電話タップ の2つ。
             *               Metaの最適化対象はこれ。「予約したい人」を探させる。
             * FindLocation… 場所の確認（Googleマップタップ）。
             *               計測はするが Lead には入れない。理由は下記。
             *
             * マップタップをLeadに含めない理由：
             *   マップは「どこにあるか見ただけ」の人も大量に押す。これをLeadに混ぜると、
             *   (1) 件数が水増しされてCPAが実態より良く見える
             *   (2) さらに悪いことに、Metaが「マップを押しやすい人」を探しに行き、
             *       予約する気のない層に配信が寄っていく
             *   計測しておけばリターゲティング用オーディエンスには使えるので、
             *   別イベントとして残すのが正解。
             */
            function fire(event, kind) {
                if (window.fbq) window.fbq('track', event, { content_name: kind + '_' + variant });
                if (window.clarity) window.clarity('set', 'cta_tapped', kind);
            }

            // LINE追加タップ（従来から Lead として計測しているもの）
            window.trackLead = function () { fire('Lead', 'line'); };
            // 電話タップ（これまで未計測。予約意図はLINEより強い）
            window.trackTel = function () { fire('Lead', 'tel'); };
            // Googleマップタップ（最適化には使わない）
            window.trackMap = function () { fire('FindLocation', 'map'); };
        })();
    </script>
    <!-- End A/B -->

    <script>
        /*
         * 読み込み時に必ずページ先頭から始めるための処理。
         *
         * 以前はここで 50ms ごとに scrollTo(0,0) を呼ぶ setInterval を2秒間回していた。
         * 目的（ブラウザによる前回位置の復元を防ぐ）は scrollRestoration='manual' だけで
         * 達成できるうえ、広告から来た人は着地直後にスクロールを始めるので、
         * 読み始めた人を2秒間くり返し最上部へ引き戻す状態になっていた。
         * load 時の scrollTo も同じ理由で削除している。
         */
        (function () {
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            // hash を消す。location.hash="" は末尾に "#" を残し履歴も汚すので replaceState を使う
            if (location.hash) history.replaceState(null, '', location.pathname + location.search);
            window.scrollTo(0, 0);
            // bfcache から復帰したときだけ先頭に戻す（通常の再描画では動かさない）
            window.addEventListener('pageshow', function (e) { if (e.persisted) window.scrollTo(0, 0); });
        })();
    </script>
